name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test the scripts
        shell: pwsh
        run: ./scripts/test-scripts.ps1

      - name: Test the service
        run: dotnet test HyperTizen.Core.Tests

      - name: Test the UI
        run: node --test "HyperTizenUI/tests/*.test.js"

      - name: Build the TV service package
        run: dotnet build HyperTizen/HyperTizen.csproj -c Release

      - name: Collect the packages
        shell: pwsh
        run: |
          ./scripts/collect-packages.ps1 -Output packages
          Get-ChildItem packages

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: packages/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag against the source version
        shell: pwsh
        run: ./scripts/check-version.ps1 -Tag $env:GITHUB_REF_NAME

      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: packages

      # Fails, and changes nothing, when a release for this tag already exists.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # Both files are named: a missing one stops the release instead of publishing half of it.
        run: |
          gh release create "$GITHUB_REF_NAME" packages/*.tpk packages/*.wgt \
            --title "HyperTizen $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md \
            --generate-notes
